experiment_id: "07_query_rewrite"
description: "Add query rewriting before retrieval — does reformulating the question help?"

dataset:
  path: "experiments/datasets/fmcg_product_qa.jsonl"
  format: "question_answer"

pipeline:
  data_source: "data/fmcg_docs"
  llm: { provider: "azure_openai", model: "gpt-4o", temperature: 0.1, max_tokens: 400 }
  embedding: { provider: "azure_openai", model: "text-embedding-3-small" }
  chunking: { strategy: "semantic", chunk_size: 128, overlap: 20 }
  retrieval: { strategy: "hybrid", top_k: 8, alpha: 0.6 }
  reranker: { enabled: true, top_k_after_rerank: 5 }
  query_transform: "rewrite"
  generation: "stuff"
  advanced: "none"

evaluation:
  metrics: [answer_correctness, faithfulness, context_precision, context_recall]
  llm_judge:
    provider: "azure_openai"
    model: "gpt-4o"
