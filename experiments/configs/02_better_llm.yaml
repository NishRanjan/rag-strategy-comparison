experiment_id: "02_better_llm"
description: "Same fixed+dense stack as baseline but with GPT-4o — does a better LLM fix weak retrieval?"

dataset:
  path: "experiments/datasets/fmcg_product_qa.jsonl"
  format: "question_answer"

pipeline:
  data_source: "data/fmcg_docs"
  llm: { provider: "azure_openai", model: "gpt-4o", temperature: 0.1, max_tokens: 400 }
  embedding: { provider: "azure_openai", model: "text-embedding-3-small" }
  chunking: { strategy: "fixed", chunk_size: 128, overlap: 20 }
  retrieval: { strategy: "dense", top_k: 3 }
  reranker: { enabled: false }
  query_transform: "none"
  generation: "stuff"
  advanced: "none"

evaluation:
  metrics: [answer_correctness, faithfulness, context_precision, context_recall]
  llm_judge:
    provider: "azure_openai"
    model: "gpt-4o"
