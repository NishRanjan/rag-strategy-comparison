experiment_id: "03_hybrid_retrieval"
description: "Semantic chunking + hybrid retrieval + Gemini 2.5 Flash - isolates the retrieval upgrade."

dataset:
  path: "experiments/datasets/fmcg_product_qa.jsonl"
  format: "question_answer"

pipeline:
  data_source: "data/fmcg_docs"
  llm: { provider: "gemini", model: "gemini-2.5-flash", temperature: 0.1, max_tokens: 400 }
  embedding: { provider: "gemini", model: "models/gemini-embedding-001" }
  chunking: { strategy: "semantic", chunk_size: 128, overlap: 20 }
  retrieval: { strategy: "hybrid", top_k: 8, alpha: 0.6 }
  reranker: { enabled: false }
  query_transform: "none"
  generation: "stuff"
  advanced: "none"
  rate_limit: { sleep_between_queries: 1, sleep_between_experiments: 5, max_retries: 3, retry_backoff: 2 }

evaluation:
  metrics: [answer_correctness, faithfulness, context_precision, context_recall]
  llm_judge:
    provider: "gemini"
    model: "gemini-2.5-flash"
